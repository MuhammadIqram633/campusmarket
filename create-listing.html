<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell an Item - CampusMarket</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="visibility:hidden">

  <header class="navbar">
    <div class="container">
      <a class="logo" href="index.html">CampusMarket</a>
      <nav>
        <ul id="navLinks" style="visibility:hidden"></ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-box">
      <h2>Sell an item</h2>
      <form id="listingForm">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-group">
          <label for="courseCode">Course code</label>
          <input type="text" id="courseCode" placeholder="e.g. CS-201">
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="textbook">Textbook</option>
            <option value="lab_equipment">Lab equipment</option>
          </select>
        </div>
        <div class="form-group">
          <label for="condition">Condition</label>
          <select id="condition">
            <option value="new">New</option>
            <option value="like_new">Like new</option>
            <option value="good" selected>Good</option>
            <option value="fair">Fair</option>
          </select>
        </div>
        <div class="form-group">
          <label for="price">Price (Rs.)</label>
          <input type="number" id="price" min="0" step="1">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="exchangeOnly"> Exchange only (no price)</label>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="4"></textarea>
        </div>
        <div class="form-group">
          <label for="fileInput">Photo or notes (PDF, JPG, PNG, WebP)</label>
          <input type="file" id="fileInput" accept="application/pdf,image/jpeg,image/png,image/webp">
          <small>A PDF stays private and is released only when you accept a buyer's request.</small>
          <img id="preview" alt="Preview" style="display:none; max-width:100%; margin-top:8px; border:1px solid #ddd;">
        </div>
        <button type="submit" class="btn">Post listing</button>
        <p class="message" id="message"></p>
      </form>
    </div>
  </main>

  <footer class="footer">CampusMarket - Zynvex Virtual Internship Project</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
<script>window.loginCheck = requireLogin();</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/create-listing.js"></script>
</body>
</html>
