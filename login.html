<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CampusMarket</title>
  <link rel="preconnect" href="https://dcgkdivastmgigmxcwua.supabase.co">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script defer src="js/supabaseClient.js"></script>
  <script defer src="js/nav.js"></script>
  <script defer src="js/login.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a class="logo" href="index.html">CampusMarket</a>
      <nav>
        <ul id="navLinks" style="visibility:hidden"></ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-box">
      <h2>Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn">Login</button>
        <p class="message" id="message"></p>
      </form>
      <p class="form-note">No account? <a href="register.html">Register here</a></p>
    </div>
  </main>

  <footer class="footer">CampusMarket - Zynvex Virtual Internship Project</footer>
</body>
</html>
