<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Listing - CampusMarket</title>
  <link rel="preconnect" href="https://dcgkdivastmgigmxcwua.supabase.co">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="visibility:hidden">

  <header class="navbar">
    <div class="container">
      <a class="logo" href="index.html">CampusMarket</a>
      <nav>
        <ul id="navLinks" style="visibility:hidden"></ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-box">
      <h2>Edit listing</h2>
      <p class="muted" id="loadMsg">Loading...</p>
      <form id="editForm" style="display:none">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-group">
          <label for="courseCode">Course code</label>
          <input type="text" id="courseCode" placeholder="e.g. CS-201">
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="textbook">Textbook</option>
            <option value="lab_equipment">Lab equipment</option>
          </select>
        </div>
        <div class="form-group">
          <label for="condition">Condition</label>
          <select id="condition">
            <option value="new">New</option>
            <option value="like_new">Like new</option>
            <option value="good">Good</option>
            <option value="fair">Fair</option>
          </select>
        </div>
        <div class="form-group">
          <label for="price">Price (Rs.)</label>
          <input type="number" id="price" min="0" step="1">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="exchangeOnly"> Exchange only (no price)</label>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="4"></textarea>
          <small>The uploaded file cannot be changed. To use a different file, delete this listing and post a new one.</small>
        </div>
        <button type="submit" class="btn">Save changes</button>
        <p class="message" id="message"></p>
      </form>
    </div>
  </main>

  <footer class="footer">CampusMarket - Zynvex Virtual Internship Project</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script>window.loginCheck = requireLogin();</script>
  <script src="js/nav.js"></script>
  <script src="js/edit-listing.js"></script>
</body>
</html>
