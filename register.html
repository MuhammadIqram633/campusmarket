<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CampusMarket</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a class="logo" href="index.html">CampusMarket</a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="register.html">Register</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-box">
      <h2>Create account</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" required>
        </div>
        <div class="form-group">
          <label for="department">Department</label>
          <input type="text" id="department" placeholder="e.g. Computer Science">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" minlength="6" required>
        </div>
        <button type="submit" class="btn">Register</button>
        <p class="message" id="message"></p>
      </form>
      <p class="form-note">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <footer class="footer">CampusMarket - Zynvex Virtual Internship Project</footer>
</body>
</html>
