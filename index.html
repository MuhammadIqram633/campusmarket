<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusMarket - Student Textbook Marketplace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a class="logo" href="index.html">CampusMarket</a>
      <nav>
        <ul id="navLinks" style="visibility:hidden"></ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Buy and sell used textbooks on campus</h1>
      <p>Find course books and lab equipment from other students.</p>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by course code, e.g. CS-201">
        <button class="btn" id="searchBtn">Search</button>
      </div>
    </section>

    <h2 class="section-title">Latest listings</h2>
    <!-- These 3 cards are sample data. Later, JavaScript will fill this from the database. -->
    <section class="listing-grid" id="listingGrid">
     
     <p id="emptyMsg"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/home.js"></script>
  <footer class="footer">CampusMarket - Zynvex Virtual Internship Project</footer>
</body>
</html>
